<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FOG — Coming Soon</title>
    <meta
      name="description"
      content="FOG. Ropa técnica de entrenamiento. La colección completa, muy pronto."
    />
    <meta name="theme-color" content="#08080a" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://fogactivewear.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FOG — Coming Soon" />
    <meta
      property="og:description"
      content="FOG. Ropa técnica de entrenamiento. La colección completa, muy pronto."
    />
    <meta property="og:url" content="https://fogactivewear.com/" />
    <meta property="og:image" content="https://fogactivewear.com/assets/img/men-black.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308080a'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial' font-size='16' font-weight='700' fill='%23c9bda8' text-anchor='middle'%3EFG%3C/text%3E%3C/svg%3E"
    />
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-latin.woff2" crossorigin />
    <link rel="preload" as="image" href="assets/img/logo-wordmark.png" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      /* Página de espera, aislada del resto del sitio: no toca styles.css,
         solo reutiliza sus tokens de color, tipografía y ritmo. */
      body[data-page="coming-soon"] {
        min-height: 100svh;
        display: grid;
      }

      .soon {
        position: relative;
        min-height: 100svh;
        display: grid;
        overflow: hidden;
      }

      .soon__media {
        position: absolute;
        inset: -6%;
        z-index: 0;
      }

      .soon__media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 22%;
        opacity: 0.4;
        filter: grayscale(0.15) contrast(1.05);
      }

      .soon__veil {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: radial-gradient(
            65% 60% at 50% 38%,
            rgba(8, 8, 10, 0.35),
            rgba(8, 8, 10, 0.88) 78%
          ),
          linear-gradient(180deg, rgba(8, 8, 10, 0.55) 0%, var(--black) 100%);
      }

      .soon__inner {
        position: relative;
        z-index: 2;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: clamp(1.5rem, 4vw, 2.5rem);
        text-align: center;
        padding: clamp(1.5rem, 6vw, 4rem);
      }

      .soon__logo {
        width: min(280px, 52vw);
      }

      .soon__headline {
        font-family: var(--font-display);
        font-weight: 900;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        font-size: clamp(2.2rem, 6vw + 1rem, 5rem);
        line-height: 0.95;
      }

      .soon__tag {
        font-size: var(--step--1);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--stone);
      }

      .soon__lede {
        max-width: 34ch;
        color: var(--bone-dim);
        font-size: var(--step-1);
        line-height: 1.5;
      }

      .soon__form {
        width: min(420px, 100%);
        margin-top: 0.5rem;
      }

      .soon__row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .soon__row input {
        flex: 1 1 220px;
        min-width: 0;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        padding: 1rem;
        color: var(--bone);
        letter-spacing: 0.02em;
      }

      .soon__row input::placeholder {
        color: var(--muted);
      }

      .soon__row input:focus {
        outline: none;
        border-color: var(--bone-dim);
      }

      .soon__status {
        margin-top: 0.85rem;
        font-size: var(--step--1);
        min-height: 1.3em;
        color: var(--stone);
      }

      .soon__status[data-state="error"] {
        color: #c9635f;
      }

      .soon__foot {
        position: absolute;
        z-index: 2;
        bottom: clamp(1.25rem, 3vw, 2rem);
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        font-size: var(--step--2);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .soon__foot a {
        color: var(--bone-dim);
        transition: color 0.3s var(--ease);
      }

      .soon__foot a:hover {
        color: var(--stone);
      }
    </style>
  </head>
  <body data-page="coming-soon">
    <main class="soon">
      <div class="soon__media" aria-hidden="true">
        <img src="assets/img/lineup.jpg" alt="" />
      </div>
      <div class="soon__veil" aria-hidden="true"></div>

      <div class="soon__inner">
        <img
          class="soon__logo"
          src="assets/img/logo-wordmark.png"
          alt="FOG"
          width="845"
          height="256"
        />
        <div>
          <h1 class="soon__headline">Coming soon</h1>
          <p class="soon__tag">Built in discipline</p>
        </div>
        <p class="soon__lede">La colección completa, muy pronto.</p>

        <form
          class="soon__form"
          data-form
          data-success="Dentro. Te avisamos en cuanto abramos."
          data-toast="Suscripción registrada"
          novalidate
        >
          <div class="soon__row">
            <label class="vh" for="soon-email">Tu correo</label>
            <input
              id="soon-email"
              name="email"
              type="email"
              required
              placeholder="tu@correo.com"
              autocomplete="email"
            />
            <button class="btn btn--ghost" type="submit"><span>Avisadme</span></button>
          </div>
          <p class="soon__status" data-form-status role="status"></p>
        </form>
      </div>

      <p class="soon__foot">
        <span>© <span data-year>2026</span> FOG</span>
        <a href="mailto:hola@fogactivewear.com">Contacto</a>
      </p>
    </main>

    <script>
      // Solo lo mínimo que necesita esta página: validar el formulario y
      // poner el año. No carga site.js completo (carrito, menú, secuencia…)
      // porque nada de eso existe aquí.
      (function () {
        "use strict";
        var form = document.querySelector("[data-form]");
        var year = document.querySelector("[data-year]");
        if (year) year.textContent = new Date().getFullYear();
        if (!form) return;

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var input = form.querySelector("input[name='email']");
          var status = form.querySelector("[data-form-status]");
          if (!input.checkValidity()) {
            if (status) {
              status.textContent = "Escribe un correo válido.";
              status.setAttribute("data-state", "error");
            }
            input.focus();
            return;
          }
          if (status) {
            status.removeAttribute("data-state");
            status.textContent = form.getAttribute("data-success");
          }
          form.reset();
        });
      })();
    </script>
  </body>
</html>
